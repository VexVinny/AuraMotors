<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aura Motors - Vendas</title>
</head>
<body>
    <h1>Módulo de Vendas</h1>
    <hr>
    <h2>Histórico de Vendas</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID Venda</th>
                <th>Data</th>
                <th>Valor Total</th>
                <th>ID Cliente</th>
                <th>ID Colaborador</th>
            </tr>
        </thead>
        <tbody>
            {% for venda in vendas %}
            <tr>
                <td>{{ venda.0 }}</td>
                <td>{{ venda.1 }}</td>
                <td>R$ {{ venda.2 }}</td>
                <td>{{ venda.3 }}</td>
                <td>{{ venda.4 }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">Nenhuma venda encontrada.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
